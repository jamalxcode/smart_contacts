name: Build Mac app

# Every push to main compiles Smart Contacts on a GitHub-hosted Apple Silicon Mac,
# runs the tests, packages "Smart Contacts.app" and publishes it as the "latest" release.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Resolve modules
        run: go mod tidy

      - name: Test
        run: go vet ./... && go test ./...

      - name: Package
        run: |
          go install fyne.io/tools/cmd/fyne@latest
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fyne package --os darwin --release --app-version "$VERSION" --app-build "$GITHUB_RUN_NUMBER"
          APP="Smart Contacts.app"
          PL="$APP/Contents/Info.plist"
          # Explain the Contacts permission prompts (Import from Mac Contacts).
          /usr/libexec/PlistBuddy -c "Add :NSAppleEventsUsageDescription string 'Smart Contacts reads your Mac Contacts when you choose Import from Mac Contacts.'" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :NSContactsUsageDescription string 'Smart Contacts imports people from your Mac Contacts when you ask it to.'" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion string 12.0" "$PL" || true
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/Smart-Contacts-mac.zip"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -la dist

      - name: Smoke test (the binary starts and imports a card)
        run: |
          export SMART_CONTACTS_DIR="$RUNNER_TEMP/sc"
          printf 'BEGIN:VCARD\nVERSION:3.0\nN:Test;Smoke;;;\nTEL:+96599998888\nEND:VCARD\n' > "$RUNNER_TEMP/t.vcf"
          "Smart Contacts.app/Contents/MacOS/smartcontacts" --import "$RUNNER_TEMP/t.vcf" || "Smart Contacts.app/Contents/MacOS/"* --import "$RUNNER_TEMP/t.vcf"
          grep -q Smoke "$SMART_CONTACTS_DIR/contacts.json"

      # GitHub's Mac runners are VMs without OpenGL, so a Fyne window can't open there
      # ("NSGL: Failed to find a suitable pixel format"). This step records what happens
      # (log + screenshot artifact) but only fails for other crashes.
      - name: Launch test (informational)
        run: |
          export SMART_CONTACTS_DIR="$RUNNER_TEMP/sc-gui"
          BIN="$(ls "Smart Contacts.app/Contents/MacOS/"* | head -1)"
          "$BIN" > "$RUNNER_TEMP/gui.log" 2>&1 &
          PID=$!
          sleep 15
          screencapture -x dist/launch.png || true
          if kill -0 $PID 2>/dev/null; then echo "ALIVE after 15s"; ALIVE=1; else echo "EXITED"; ALIVE=0; fi
          echo "----- app output -----"; cat "$RUNNER_TEMP/gui.log"
          echo "----- crash reports -----"; ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -5
          f=$(ls -t ~/Library/Logs/DiagnosticReports/*smartcontacts* 2>/dev/null | head -1); if [ -n "$f" ]; then head -80 "$f"; fi
          echo "----- windows -----"
          osascript -e 'tell application "System Events" to get name of every window of (every process whose unix id is '"$PID"')' 2>&1 || true
          kill $PID 2>/dev/null || true
          cp "$RUNNER_TEMP/gui.log" dist/gui.log
          if [ "$ALIVE" = 1 ]; then exit 0; fi
          if grep -q "NSGL: Failed to find a suitable pixel format" "$RUNNER_TEMP/gui.log"; then
            echo "::notice::Runner has no OpenGL; window not testable here (not an app bug)."
            exit 0
          fi
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-test
          path: |
            dist/launch.png
            dist/gui.log

      - uses: actions/upload-artifact@v4
        with:
          name: Smart-Contacts-mac
          path: dist/Smart-Contacts-mac.zip

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/Smart-Contacts-mac.zip \
            --title "Smart Contacts ${VERSION}" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M') UTC. Apple Silicon Mac app, ad-hoc signed. Install with the one-line command in the README." \
            --latest
